  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - test
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: Bump version and push tag
      id: tag
      uses: anothrNick/github-tag-action@1.67.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: true
        DEFAULT_BUMP: patch
        INITIAL_VERSION: 0.1.0
    - name: Slack Notification
      if: always()
      uses: ravsamhq/notify-slack-action@v2
      with:
        status: ${{ job.status }}
        footer: '<{run_url}|View Action Workflow Details>'
        notification_title: "New *core-utils* release: `${{ steps.tag.outputs.new_tag }}`"
        mention_groups: 'S077TJKD31V'
        mention_groups_when: 'success'
        notify_when: 'success'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.RELEASEBOT_WEBHOOK_DEV }}
    - uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.WAND_ACTION_TOKEN }}"
        prerelease: false
        automatic_release_tag: ${{ steps.tag.outputs.new_tag }}
        files: |
          README.md
